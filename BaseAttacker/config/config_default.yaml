LSTM_ENCODER:
  EMBEDDING_DIM: 128    # LSTM hidden size = output embedding dimension
  SEQ_LEN: 50           # trajectory window length per encoder chunk (was 1000 — overkill for 36-state grid)
  MEMORY_SIZE: 500      # capacity of each victim's circular trajectory buffer (scaled with SEQ_LEN)
  N_EPOCHS: 2           # training epochs per train_encoder() call
  LR: 0.001             # SGD learning rate

AE:
  EMBEDDING_SIZE: 5
  SEQ_LEN: 5
  LEN_TRAJECTORY: 5
  MEMORY_SIZE: 50
  DEFAULT_KWARGS:
    input_size: 2
    hidden_size: 128
    output_size: 16  # EMBEDDING_SIZE
    learning_rate: 0.001
    num_epochs: 10
  ENV_KWARGS:
    enc_in_size: 2
    enc_out_size: 16  # EMBEDDING_SIZE
    enc_num_layer: 1
    dec_fc_in_size: 17  # enc_out_size + 1
    dec_lstm_in_size: 18  # enc_out_size + 2
    dec_lstm_num_layer: 1
    n_epochs: 2
    lr: 0.001

VICTIM:
  TMAX: 100
  DEFAULT_KWARGS:
    memory_size: 50  # From victim_Q.py MEMORY_SIZE
    discount_factor: 1.0  # From victim_Q.py default arg
    alpha: 0.1  # From victim_Q.py default arg
    epsilon: 0.1  # From victim_Q.py default arg
    # Commenting out unused params
    # max_epsilon: 1.0
    # min_epsilon: 0.01
    # decay_rate: 0.01

ATTACK:
  DEFAULT_KWARGS:
    seed: 0
    hidden1: 400
    hidden2: 300
    init_w: 0.003
    prate: 0.0001
    rate: 0.001
    ou_theta: 0.15
    ou_mu: 0.0
    ou_sigma: 0.2
    bsize: 256
    tau: 0.005
    discount: 0.9
    epsilon_divisor: 1000
    updates_per_step: 1
    is_training: true
  PPO_KWARGS:
    hidden1: 256
    hidden2: 256
    actor_lr: 0.0003
    critic_lr: 0.001
    gamma: 0.99
    gae_lambda: 0.95
    clip_epsilon: 0.2
    ppo_epochs: 10
    mini_batch_size: 64
    max_grad_norm: 0.5
    entropy_coef: 0.01
    value_loss_coef: 0.5
    rollout_size: 256

experiment:
  privacy_mode: "partial_blackbox"  # Can be: "full_whitebox", "partial_blackbox", or "full_blackbox"

# Collective attack settings (multi-victim)
# Based on "Poisoning the Well: Can We Simultaneously Attack a Group of Learning Agents?" (ALA 2023)
COLLECTIVE:
  NUM_VICTIMS: 5  # Number of independent victim agents (K)
  ENCODER_TYPE: "vae_barycenter"  # Can be: "vae_barycenter", "mean_embedding", "concat_embedding", "mean_behavior"
  BASE_SEED: 0  # Base random seed (victim k gets seed BASE_SEED + k)
  VAE:
    LATENT_SIZE: 8  # Dimension of VAE latent space
    HIDDEN_SIZE: 128  # Hidden layer size for VAE encoder/decoder
    LEARNING_RATE: 0.001  # Learning rate for VAE training
    BETA: 1.0  # KL divergence weight (beta-VAE)
    PRETRAIN_EPOCHS: 20  # Number of epochs for VAE pre-training
    PRETRAIN_SAMPLES: 5000  # Number of synthetic samples for pre-training
