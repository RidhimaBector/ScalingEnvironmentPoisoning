# Hyperparameters internal to the learners. Experiment settings (which environment,
# which victim, how long, ...) are in defaults.py.

# Online trajectory encoder (encoder_mode="lstm")
LSTM_ENCODER:
  EMBEDDING_DIM: 128    # LSTM hidden size = embedding dimension
  SEQ_LEN: 50           # trajectory window that is embedded
  MEMORY_SIZE: 500      # transitions kept per victim
  N_EPOCHS: 2           # training epochs per attack episode
  LR: 0.001

# Tabular victims (Q-learning, SARSA, REINFORCE)
VICTIM:
  DEFAULT_KWARGS:
    discount_factor: 1.0
    alpha: 0.1
    epsilon: 0.1

ATTACK:
  # DDPG attacker; values set in defaults.py take precedence
  DEFAULT_KWARGS:
    hidden1: 400
    hidden2: 300
    init_w: 0.003
    prate: 0.0001
    rate: 0.001
    ou_theta: 0.15
    ou_mu: 0.0
    ou_sigma: 0.2
    bsize: 256
    tau: 0.005
    discount: 0.9
    epsilon_divisor: 1000
    updates_per_step: 1
  # PPO attacker (experimental)
  PPO_KWARGS:
    hidden1: 256
    hidden2: 256
    actor_lr: 0.0003
    critic_lr: 0.001
    gamma: 0.99
    gae_lambda: 0.95
    clip_epsilon: 0.2
    ppo_epochs: 10
    mini_batch_size: 64
    max_grad_norm: 0.5
    entropy_coef: 0.01
    value_loss_coef: 0.5
    rollout_size: 256
